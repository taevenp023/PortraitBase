<!DOCTYPE html>
<!-- saved from url=(0235)file:///Users/yolanda/Library/Application%20Support/Claude/local-agent-mode-sessions/f5dc671d-22ee-44ea-b30b-60fd5b5a048e/cc7f1008-7a05-4f7c-95da-1aa4f975753c/local_6f9ff046-078e-448d-b5fd-13e0c67d5651/outputs/assignment_dashboard.html -->
<html lang="en">

<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PORTRAIT Dashboard</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #f5f4f0;
      --surface: #ffffff;
      --surface2: #f0efe9;
      --border: #e2e0d8;
      --border-strong: #cbc7ba;
      --text: #1a1917;
      --text2: #6b6860;
      --text3: #9b9890;
      --accent: #2d5be3;
      --accent-bg: #eef2fc;
      --green: #1a7f4b;
      --green-bg: #e8f7ef;
      --amber: #a05c00;
      --amber-bg: #fef3e2;
      --red: #c0392b;
      --red-bg: #fdecea;
      --radius: 10px;
      --radius-sm: 6px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
    }

    .app {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: 100vh;
    }

    .sidebar {
      background: var(--surface);
      border-right: 1px solid var(--border);
      padding: 24px 0;
      display: flex;
      flex-direction: column;
    }

    .main {
      padding: 28px 32px;
      overflow-x: hidden;
    }

    .logo {
      padding: 0 20px 20px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .logo-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text);
    }

    .logo-sub {
      font-size: 12px;
      color: var(--text2);
      margin-top: 2px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 20px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text2);
      border-left: 2px solid transparent;
      transition: all 0.15s;
    }

    .nav-item:hover {
      background: var(--bg);
      color: var(--text);
    }

    .nav-item.active {
      color: var(--accent);
      background: var(--accent-bg);
      border-left-color: var(--accent);
      font-weight: 500;
    }

    .nav-section {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text3);
      padding: 12px 20px 4px;
    }

    .page-header {
      margin-bottom: 24px;
    }

    .page-title {
      font-size: 22px;
      font-weight: 600;
      color: var(--text);
    }

    .page-sub {
      font-size: 13px;
      color: var(--text2);
      margin-top: 4px;
    }

    .stat-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .stat-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text2);
      margin-bottom: 6px;
    }

    .stat-val {
      font-size: 26px;
      font-weight: 600;
      color: var(--text);
      font-family: 'DM Mono', monospace;
    }

    .stat-hint {
      font-size: 11px;
      color: var(--text3);
      margin-top: 3px;
    }

    /* MATRIX */
    .matrix-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .matrix-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }

    .toolbar-title {
      font-size: 14px;
      font-weight: 600;
    }

    .toolbar-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .legend {
      display: flex;
      gap: 12px;
      align-items: center;
      font-size: 11px;
      color: var(--text2);
    }

    .legend-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 4px;
    }

    .table-scroll {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }

    thead tr.team-row th {
      background: var(--surface2);
      padding: 8px 6px;
      text-align: center;
      font-weight: 600;
      font-size: 11px;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    thead tr.team-row th.th-part-spacer {
      background: var(--surface);
      border-right: 2px solid var(--text3);
    }

    thead tr.team-row th.th-totals-spacer {
      background: var(--surface2);
      border-left: 2px solid var(--text3);
    }

    thead tr.student-row th {
      background: var(--surface2);
      padding: 8px 4px;
      text-align: center;
      font-weight: 500;
      font-size: 11px;
      color: var(--text2);
      border-bottom: 2px solid var(--border);
      border-right: 1px solid var(--border-strong);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      min-width: 78px;
    }

    thead tr.student-row th.th-part {
      text-align: left;
      background: var(--surface);
      border-right: 2px solid var(--text3);
      font-size: 12px;
      color: var(--text2);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    thead tr.student-row th.th-last-in-team {
      border-right: 2px solid var(--text3);
    }

    thead tr.student-row th.th-totals {
      background: var(--surface2);
      border-left: 2px solid var(--text3);
      min-width: 70px;
      font-size: 11px;
    }

    tbody tr:hover td {
      background: #faf9f6;
    }

    td {
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border-strong);
      vertical-align: middle;
    }

    td.last-in-team,
    tfoot td.last-in-team {
      border-right: 2px solid var(--text3);
    }

    td.td-part {
      padding: 10px 12px;
      background: var(--surface);
      position: sticky;
      left: 0;
      z-index: 1;
      border-right: 2px solid var(--text3);
    }

    .part-name {
      font-weight: 500;
      font-size: 13px;
      color: var(--text);
      margin-bottom: 5px;
    }

    .part-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      align-items: center;
    }

    .wt-badge {
      font-size: 10px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      padding: 2px 6px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text2);
    }

    .slo-chip {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 20px;
      font-weight: 500;
    }

    td.td-cell {
      padding: 8px 4px;
      text-align: center;
      cursor: pointer;
      transition: background 0.1s;
      border-right: 1px solid var(--border-strong);
    }

    td.td-cell:hover {
      background: var(--accent-bg) !important;
    }

    td.td-cell.claimed {
      background: #eef5ff;
    }

    td.td-cell.required-lock {
      background: #edfaf3 !important;
      cursor: default;
    }

    td.td-cell.required-lock:hover {
      background: #e0f5eb !important;
    }

    td.td-cell.not-mine {
      cursor: default;
      opacity: 0.5;
    }

    td.td-cell.not-mine:hover {
      background: transparent !important;
    }

    .checkbox.required {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    td.td-cell.last-in-team {
      border-right: 2px solid var(--text3);
    }

    .cell-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
    }

    .checkbox {
      width: 20px;
      height: 20px;
      border: 1.5px solid var(--border);
      border-radius: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      transition: all 0.15s;
      color: transparent;
    }

    .checkbox.checked {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .wt-input {
      width: 50px;
      font-size: 11px;
      font-family: 'DM Mono', monospace;
      padding: 2px 4px;
      border: 1px solid var(--border);
      border-radius: 4px;
      text-align: center;
      background: var(--surface);
      color: var(--text);
      outline: none;
    }

    .wt-input:focus {
      border-color: var(--accent);
    }

    td.td-total {
      padding: 8px 10px;
      text-align: center;
      background: var(--surface2);
      font-size: 12px;
      font-family: 'DM Mono', monospace;
      font-weight: 500;
      border-left: 2px solid var(--border);
    }

    tfoot td {
      background: var(--surface2);
      padding: 10px 12px;
      font-size: 11px;
      font-weight: 600;
      border-top: 2px solid var(--border);
      text-align: center;
      font-family: 'DM Mono', monospace;
    }

    tfoot td.tfoot-label {
      text-align: left;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text2);
      font-family: 'DM Sans', sans-serif;
    }

    tfoot td.last-in-team {
      border-right: 2px solid var(--border);
    }

    /* COVERAGE */
    .coverage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 14px;
      margin-bottom: 24px;
    }

    .slo-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
    }

    .slo-card-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 10px;
    }

    .slo-bar-bg {
      height: 8px;
      background: var(--surface2);
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .slo-bar-fill {
      height: 8px;
      border-radius: 4px;
      transition: width 0.4s;
    }

    .slo-card-stats {
      font-size: 11px;
      color: var(--text2);
      display: flex;
      justify-content: space-between;
    }

    /* SETUP */
    .setup-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    .setup-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
    }

    .setup-card-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 14px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .team-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .team-block-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .team-block-name {
      font-size: 13px;
      font-weight: 600;
      flex: 1;
    }

    .team-block-count {
      font-size: 11px;
      color: var(--text3);
      font-family: 'DM Mono', monospace;
    }

    .student-list {
      padding: 6px 10px;
    }

    .student-row-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .student-row-item:hover {
      background: var(--bg);
    }

    .student-row-item span {
      flex: 1;
    }

    .student-add-row {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      border-top: 1px solid var(--border);
    }

    .list-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 6px;
      font-size: 13px;
      background: var(--surface2);
    }

    .list-row span {
      flex: 1;
    }

    .remove-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      font-size: 18px;
      line-height: 1;
      padding: 0;
      transition: color 0.1s;
    }

    .remove-btn:hover {
      color: var(--red);
    }

    .rename-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--text3);
      padding: 3px;
      display: flex;
      align-items: center;
      border-radius: 4px;
      opacity: 0.6;
      transition: opacity 0.1s, color 0.1s, background 0.1s;
    }

    .rename-btn:hover {
      opacity: 1;
      color: var(--accent);
      background: var(--accent-bg);
    }

    .form-group {
      margin-bottom: 10px;
    }

    .form-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 4px;
    }

    .form-input {
      width: 100%;
      padding: 8px 10px;
      font-size: 13px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      outline: none;
    }

    .form-input:focus {
      border-color: var(--accent);
    }

    .slo-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .slo-pick {
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid var(--border);
      cursor: pointer;
      font-weight: 500;
      transition: all 0.15s;
      background: var(--surface2);
      color: var(--text2);
    }

    .slo-pick.on {
      color: #fff;
      border-color: transparent;
    }

    .btn {
      padding: 8px 14px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.15s;
    }

    .btn:hover {
      background: var(--surface2);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover {
      background: #2451c8;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 11px;
    }

    .btn-danger {
      border-color: var(--red-bg);
      background: var(--red-bg);
      color: var(--red);
    }

    .btn-danger:hover {
      background: #fad7d4;
    }

    .coverage-table-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
    }

    .coverage-table-wrap table th {
      background: var(--surface2);
      padding: 10px 14px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text2);
      border-bottom: 1px solid var(--border);
    }

    .coverage-table-wrap table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      font-size: 13px;
    }

    .coverage-table-wrap table tr:last-child td {
      border-bottom: none;
    }

    /* ASSIGNMENT GROUP ROW */
    tr.assignment-separator td {
      height: 10px;
      background: #1a2340;
      border: none;
      padding: 0;
    }

    tr.assignment-group td {
      background: var(--surface2);
      padding: 9px 12px;
      font-weight: 600;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
      border-top: 2px solid var(--border);
      cursor: pointer;
      user-select: none;
    }

    tr.assignment-group td:first-child {
      position: sticky;
      left: 0;
      z-index: 2;
      border-right: 1px solid var(--border);
    }

    tr.assignment-group:hover td {
      background: #e8e7e1;
    }

    .assignment-group-inner {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .collapse-icon {
      font-size: 10px;
      color: var(--text3);
      transition: transform 0.15s;
      display: inline-block;
    }

    .collapse-icon.open {
      transform: rotate(90deg);
    }

    .assignment-name {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    /* SETUP - ASSIGNMENT BLOCK */
    .assign-block {
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      margin-bottom: 10px;
      overflow: hidden;
    }

    .assign-block-header {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface2);
      border-bottom: 1px solid var(--border);
    }

    .assign-block-info {
      flex: 1;
      min-width: 0;
    }

    .assign-block-name {
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }

    .assign-slo-picker {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .assign-parts-list {
      padding: 6px 10px;
    }

    .assign-part-row {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 6px;
      border-radius: 4px;
      font-size: 12px;
    }

    .assign-part-row:hover {
      background: var(--bg);
    }

    .assign-part-row span {
      flex: 1;
    }

    .assign-part-wt {
      font-family: 'DM Mono', monospace;
      font-size: 11px;
      color: var(--text3);
    }

    .assign-part-add {
      display: flex;
      gap: 6px;
      padding: 6px 10px;
      border-top: 1px solid var(--border);
    }

    /* DRAG AND DROP */
    .drag-handle {
      color: var(--text3);
      cursor: grab;
      padding: 0 8px 0 4px;
      display: flex;
      align-items: center;
      flex-shrink: 0;
      opacity: 0.5;
      transition: opacity 0.1s;
    }

    .drag-handle:hover {
      opacity: 1;
    }

    .drag-handle:active {
      cursor: grabbing;
    }

    .assign-block[draggable] {
      transition: opacity 0.15s;
    }

    .assign-block.drag-over {
      outline: 2px dashed var(--accent);
      outline-offset: -2px;
      background: var(--accent-bg);
    }

    .assign-part-row.drag-over {
      background: var(--accent-bg) !important;
      border-radius: 4px;
    }

    /* COVERAGE - per-assignment table */
    .assign-coverage-cell {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 80px;
    }

    .assign-coverage-wt {
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
    }

    .assign-slos-inline {
      display: flex;
      flex-wrap: wrap;
      gap: 3px;
    }

    .tag-none {
      font-size: 11px;
      color: var(--text3);
    }

    .empty {
      text-align: center;
      padding: 40px;
      color: var(--text2);
      font-size: 13px;
    }

    .section-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 12px;
    }

    /* AUTH BADGE */
    .user-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .user-badge.instructor {
      background: var(--accent-bg);
      border-color: #c5d4f7;
      color: var(--accent);
    }

    .user-badge.student {
      background: var(--green-bg);
      border-color: #b6e8d0;
      color: var(--green);
    }

    /* LOGIN PATH BUTTONS */
    .login-path-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
    }

    .login-path-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 22px 12px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      background: var(--surface2);
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.18s;
    }

    .login-path-btn:hover {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .login-path-btn.active {
      border-color: var(--accent);
      background: var(--accent-bg);
    }

    .login-path-label {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
    }

    .login-path-sub {
      font-size: 11px;
      color: var(--text2);
      text-align: center;
      line-height: 1.4;
    }

    /* LOGIN OVERLAY / CARD */
    .login-overlay {

  <script>
    const SLO_COLORS = ['#2d5be3', '#1a7f4b', '#a05c00', '#7b3fbd', '#c0392b', '#0e7490', '#6d5a00', '#8b4a62'];
    const SLO_BKGS = ['#eef2fc', '#e8f7ef', '#fef3e2', '#f3eeff', '#fdecea', '#e0f7fd', '#fefce0', '#fceef4'];
    const DEFAULT_SLO_DESCRIPTIONS = [
      'Analyze a complex computing problem and apply principles of computing and other relevant disciplines to identify solutions.',
      'Design computing-based solutions to meet a given set of computing requirements.',
      'Implement computing-based solutions to meet a given set of computing requirements.',
      'Communicate effectively in a variety of professional contexts.',
      'Recognize professional responsibilities and make informed judgments in computing practice based on legal and ethical principles.',
      'Function effectively as a member or leader of a team engaged in activities appropriate to the program\'s discipline.',
      'Apply computer science theory and software development fundamentals to produce computing-based solutions.',
      'Acquire and apply new knowledge as needed, using appropriate learning strategies.',
    ];
    function sloColor(index) { return SLO_COLORS[index % SLO_COLORS.length]; }
    function sloBackground(index) { return SLO_BKGS[index % SLO_BKGS.length]; }
    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
      })[char]);
    }
    let expandedSloIdx = new Set(); // keys are "<context>:<si>" so expand state doesn't bleed between pickers
    window.toggleSloExpand = (context, si) => {
      const key = context + ':' + si;
      expandedSloIdx.has(key) ? expandedSloIdx.delete(key) : expandedSloIdx.add(key);
      syncEditingPartFields();
      renderMain();
    };
    let uidCounter = 100;
    function uid() { return 'u' + (++uidCounter); }

    // All shared data lives in Netlify Database, reached through /api/* (see
    // netlify/functions/dashboard.ts). Every write bumps a server-side revision
    // number, which the realtime poller below uses to notice other people's changes.
    let _revision = 0;
    // Incremented on every local write so a poll response that was requested before
    // the write (and so predates it) can be recognised and thrown away.
    let _localSeq = 0;
    let _inflight = 0;
    async function api(method, path, body) {
      _localSeq++;
      _inflight++;
      try {
        const res = await fetch(path, {
          method,
          headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
          body: body === undefined ? undefined : JSON.stringify(body),
        });
        if (!res.ok) throw new Error(method + ' ' + path + ' → ' + res.status);
        return await res.json();
      } finally {
        _inflight--;
      }
    }

    let _saveTimer;
    // True while this browser has a local change queued that hasn't reached the
    // database yet (see saveState below). The realtime poller checks this before
    // merging an incoming snapshot — otherwise a *different*, already-confirmed write
    // (e.g. the selections cleanup that fires immediately when deleting an assignment)
    // could bring back a snapshot that predates this change and silently overwrite it
    // before the debounce timer below gets a chance to send it.
    let _saveDirty = false;
    function saveState() {
      _saveDirty = true;
      _localSeq++;
      clearTimeout(_saveTimer);
      _saveTimer = setTimeout(() => {
        // `selections` is written separately, per-key (see saveSelectionField/saveSelections),
        // so a browser tab that's been open a while — and hasn't seen other students' picks yet —
        // can never overwrite the whole selections map with its own stale copy.
        // `view` is which page THIS browser has open, so it isn't shared either.
        const { selections, view, ...rest } = state;
        api('PUT', '/api/state', rest).then(() => {
          _saveDirty = false;
          const ind = document.getElementById('save-indicator');
          if (ind) { ind.textContent = '✓ Saved'; setTimeout(() => { ind.textContent = ''; }, 1500); }
          updateSidebarStats();
        }).catch(e => { _saveDirty = false; console.warn('Database save failed:', e); });
      }, 600);
    }

    // Atomic write of exactly one selection — safe even if this browser's local
    // `state` is stale, since it only ever touches this one row on the server.
    // Pass null to remove the selection.
    function saveSelectionField(pid, sid, value) {
      const path = '/api/selections/' + encodeURIComponent(pid) + '/' + encodeURIComponent(sid);
      (value === null ? api('DELETE', path) : api('PUT', path, value))
        .catch(e => console.warn('Database selection save failed:', e));
    }

    // Full replace of the selections map — only for rare bulk admin actions
    // (clear all, delete a student/team/assignment/part), not per-click student use.
    function saveSelections() {
      api('PUT', '/api/selections', state.selections).catch(e => console.warn('Database selections save failed:', e));
    }

    async function loadState() {
      try {
        const res = await fetch('/api/state');
        if (!res.ok) throw new Error('GET /api/state → ' + res.status);
        const { revision, state: saved } = await res.json();
        _revision = revision;
        // Revision 0 means nothing has ever been saved — keep the built-in defaults.
        if (revision > 0) {
          const parsed = saved;
          // migrate old format (flat parts with slos) → new assignments format
          if (parsed.parts && !parsed.assignments) {
            parsed.assignments = [{
              id: uid(), name: 'Assignment 1',
              slos: [...new Set(parsed.parts.flatMap(p => p.slos || []))],
              collapsed: false,
              parts: parsed.parts.map(p => ({ id: p.id, name: p.name, weight: p.weight }))
            }];
            delete parsed.parts;
          }
          // Migrate old SLOs to new ones if still on the original set
          const OLD_SLOS = ['SLO 1: Critical Thinking', 'SLO 2: Communication', 'SLO 3: Research Methods', 'SLO 4: Data Analysis', 'SLO 5: Synthesis'];
          if (parsed.slos && parsed.slos[0] === OLD_SLOS[0]) {
            parsed.slos = state.slos; // replace with new defaults
            parsed.sloDescriptions = [...DEFAULT_SLO_DESCRIPTIONS];
            if (parsed.assignments) parsed.assignments.forEach(a => { a.slos = []; }); // clear stale indices
          }
          Object.assign(state, parsed);
          state.sloDescriptions = state.slos.map((_, i) =>
            parsed.sloDescriptions?.[i] ?? DEFAULT_SLO_DESCRIPTIONS[i] ?? '');
          // migrate teams/students missing IDs
          let needsSave = false;
          state.teams.forEach(t => {
            if (!t.id) { t.id = uid(); needsSave = true; }
            if (!t.students) t.students = [];
            t.students.forEach(s => { if (!s.id) { s.id = uid(); needsSave = true; } });
          });
          // migrate assignment-level SLOs → per-part SLOs (SLOs are now assigned per section)
          state.assignments.forEach(a => {
            a.parts.forEach(p => {
              if (!p.slos) {
                p.slos = (a.slos && a.slos.length) ? [...a.slos] : [];
                needsSave = true;
              }
            });
          });
          if (needsSave) saveState();
          // recalc uidCounter to avoid ID collisions
          const allIds = [
            ...state.teams.flatMap(t => [t.id, ...t.students.map(s => s.id)]),
            ...state.assignments.flatMap(a => [a.id, ...a.parts.map(p => p.id)])
          ];
          allIds.forEach(id => {
            const n = parseInt(id.replace(/\D/g, ''));
            if (!isNaN(n) && n > uidCounter) uidCounter = n;
          });
          // Clear any stale pairings that have unpaired entries — force re-generation
          if (state.assessmentPairings) {
            Object.keys(state.assessmentPairings).forEach(k => {
              if (state.assessmentPairings[k].some(p => p.unpaired)) delete state.assessmentPairings[k];
            });
          }
        }
      } catch (e) { console.warn('Database load failed:', e); }
    }

    // Keeps this browser's local `state` in sync with what everyone else has saved,
    // instead of only ever reading it once at page load. Without this, a tab left
    // open for a while has no way to learn about other students' picks before its
    // own next save — which is what let one save silently blow away another's.
    const SYNC_INTERVAL_MS = 3000;
    async function pollForChanges() {
      if (document.hidden) return;
      const seq = _localSeq;
      const res = await fetch('/api/state?since=' + _revision);
      if (res.status === 204 || !res.ok) return; // nothing new (or a transient error)
      const { revision, state: remote } = await res.json();
      // We have a local change queued or in flight, or made one while this request
      // was out — applying this snapshot now would overwrite it with server state
      // that predates that change. Skip it; the next poll picks up the result.
      if (_saveDirty || _inflight > 0 || seq !== _localSeq) return;
      _revision = revision;
      Object.assign(state, remote);
      const active = document.activeElement;
      const isTyping = active && (active.tagName === 'INPUT' || active.tagName === 'TEXTAREA');
      if (currentUser && !isTyping) renderMain({ skipSave: true });
    }
    function startRealtimeSync() {
      setInterval(() => {
        pollForChanges().catch(e => console.warn('Database realtime sync failed:', e));
      }, SYNC_INTERVAL_MS);
    }

    window.exportData = () => {
      const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'portrait-data.json';
      a.click();
    };

    window.importData = (event) => {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const parsed = JSON.parse(e.target.result);
          if (parsed.teams && (parsed.assignments || parsed.parts) && parsed.slos) {
            Object.assign(state, parsed);
            saveState();
            saveSelections();
            renderMain();
          } else { alert('Invalid data file.'); }
        } catch (err) { alert('Could not read file.'); }
        event.target.value = '';
      };
      reader.readAsText(file);
    };

    let state = {
      view: 'matrix',
      teams: [
        {
          id: 't1', name: 'Team A', students: [
            { id: 's1', name: 'Alice' }, { id: 's2', name: 'Bob' }, { id: 's3', name: 'Charlie' }, { id: 's4', name: 'Diana' }
          ]
        },
        {
          id: 't2', name: 'Team B', students: [
            { id: 's5', name: 'Ethan' }, { id: 's6', name: 'Fiona' }, { id: 's7', name: 'George' }
          ]
        },
        {
          id: 't3', name: 'Team C', students: [
            { id: 's8', name: 'Hannah' }, { id: 's9', name: 'Ivan' }, { id: 's10', name: 'Jade' }
          ]
        },
      ],
      slos: [
        'SLO 1: Solution Identification',
        'SLO 2a: Solution Design',
        'SLO 2b: Solution Implementation',
        'SLO 3: Communication',
        'SLO 4: Ethical Decision Making',
        'SLO 5: Teamwork',
        'SLO 6: Experimentation & Evaluation',
        'SLO 7: Information Literacy',
      ],
      sloDescriptions: [...DEFAULT_SLO_DESCRIPTIONS],
      assignments: [
        {
          id: 'a1', name: 'Research Paper', collapsed: false,
          parts: [
            { id: 'p1', name: 'Introduction & Background', weight: 5, slos: [0, 1] },
            { id: 'p2', name: 'Literature Review', weight: 10, slos: [0, 7] },
            { id: 'p3', name: 'Research Methodology', weight: 15, slos: [1, 6] },
            { id: 'p4', name: 'Data Collection', weight: 10, slos: [6] },
            { id: 'p5', name: 'Analysis & Results', weight: 20, slos: [1, 6] },
            { id: 'p6', name: 'Discussion', weight: 15, slos: [2, 3] },
            { id: 'p7', name: 'Conclusions', weight: 10, slos: [2] },
            { id: 'p8', name: 'References', weight: 5, slos: [7] },
          ]
        },
        {
          id: 'a2', name: 'Group Presentation', collapsed: false,
          parts: [
            { id: 'p9', name: 'Slides & Visual Design', weight: 25, slos: [3] },
            { id: 'p10', name: 'Delivery & Narration', weight: 35, slos: [3, 5] },
            { id: 'p11', name: 'Q&A Responses', weight: 20, slos: [2, 3] },
            { id: 'p12', name: 'Executive Summary', weight: 20, slos: [4, 5] },
          ]
        },
      ],
      selections: {},
      assessmentPairings: {},
      teamPasswords: {},
      masterPassword: null,
    };

    // UI state — not persisted
    let matrixCollapsedTeams = new Set();
    let setupTeamsExpanded = false;
    let setupSlosExpanded = true;
    let editingSloIdx = null;
    let setupAssignmentsExpanded = true;
    let setupExpandedAssignments = new Set();
    let renamingAssignId = null;
    let renamingTeamId = null;
    let editingPartId = null;
    let newPartSlos = {}; // aid -> [si,...] picked before the section exists yet
    let newPartDrafts = {}; // aid -> {name,weight,isAssessment,requiredAll} — survives unrelated re-renders
    const DEV_MODE = false;
    let currentUser = DEV_MODE ? { type: "instructor" } : null;
    let collapsedAssessmentParts = new Set(); // null=login required | {type:'instructor'} | {type:'team',teamId,teamName}
    let summaryCollapsedAssignments = new Set();

    /* ─── HELPERS ─── */
    function allStudents() {
      return state.teams.flatMap(t => t.students.map(s => ({ ...s, teamId: t.id, teamName: t.name })));
    }
    function allParts() {
      return state.assignments.flatMap(a => a.parts.map(p => ({ ...p, assignId: a.id })));
    }
    function findPart(pid) {
      for (const a of state.assignments) {
        const p = a.parts.find(p => p.id === pid);
        if (p) return p;
      }
      return null;
    }
    function selKey(pid, sid) { return pid + '_' + sid; }

    /* ─── FILE SYSTEM HANDLE (student auto-save) ─── */
    async function dbOpen() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('capstone-fsh', 1);
        r.onupgradeneeded = e => e.target.result.createObjectStore('fsh');
        r.onsuccess = e => res(e.target.result);
        r.onerror = () => rej(r.error);
      });
    }
    async function dbGet(key) {
      const db = await dbOpen();
      return new Promise((res, rej) => {
        const r = db.transaction('fsh', 'readonly').objectStore('fsh').get(key);
        r.onsuccess = () => res(r.result ?? null);
        r.onerror = () => rej(r.error);
      });
    }
    async function dbPut(key, val) {
      const db = await dbOpen();
      return new Promise((res, rej) => {
        const tx = db.transaction('fsh', 'readwrite');
        tx.objectStore('fsh').put(val, key);
        tx.oncomplete = res;
        tx.onerror = () => rej(tx.error);
      });
    }

    function _downloadJSON(data, teamName) {
      const blob = new Blob([data], { type: 'application/json' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'portrait-' + (teamName || 'student').toLowerCase().replace(/\s+/g, '-') + '-data.json';
      a.click();
    }

    window.saveStudentToFile = async () => {
      saveState();
      const data = JSON.stringify(state, null, 2);
      const teamName = currentUser?.teamName || 'student';
      const showMsg = (txt) => {
        const el = document.getElementById('student-save-msg');
        if (el) { el.textContent = txt; setTimeout(() => { el.textContent = ''; }, 3000); }
      };
      if (window.showSaveFilePicker) {
        try {
          let handle = await dbGet('studentFileHandle');
          if (handle) {
            // Reuse the existing file
            const perm = await handle.queryPermission({ mode: 'readwrite' });
            if (perm !== 'granted') handle = null;
          }
          if (!handle) {
            handle = await window.showSaveFilePicker({
              suggestedName: 'portrait-' + teamName.toLowerCase().replace(/\s+/g, '-') + '-data.json',
              types: [{ description: 'JSON Data', accept: { 'application/json': ['.json'] } }]
            });
            await dbPut('studentFileHandle', handle);
          }
          const w = await handle.createWritable();
          await w.write(data);
          await w.close();
          showMsg('✓ Saved to file');
          return;
        } catch (e) { if (e.name === 'AbortError') return; }
      }
      _downloadJSON(data, teamName);
      showMsg('✓ Downloaded');
    };

    window._pendingStudentHandle = null;

    async function tryAutoLoadStudentData() {
      if (!window.showSaveFilePicker) return false;
      try {
        const handle = await dbGet('studentFileHandle');
        if (!handle) return false;
        const perm = await handle.queryPermission({ mode: 'read' });
        if (perm === 'prompt') {
          window._pendingStudentHandle = handle; // show manual-load button
          return false;
        }
        if (perm !== 'granted') return false;
        const file = await handle.getFile();
        const parsed = JSON.parse(await file.text());
        if (parsed.teams && parsed.assignments) { Object.assign(state, parsed); saveState(); return true; }
      } catch (e) { }
      return false;
    }

    window.loadStudentFileManually = async () => {
      try {
        let handle = window._pendingStudentHandle;
        if (!handle) {
          const [picked] = await window.showOpenFilePicker({
            types: [{ description: 'JSON Data', accept: { 'application/json': ['.json'] } }]
          });
          handle = picked;
        }
        const perm = await handle.requestPermission({ mode: 'readwrite' });
        if (perm !== 'granted') return;
        await dbPut('studentFileHandle', handle);
        const file = await handle.getFile();
        const parsed = JSON.parse(await file.text());
        if (parsed.teams && parsed.assignments) { Object.assign(state, parsed); saveState(); renderMain(); }

    /* ─── AUTH ─── */
    async function sha256(str) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('portrait-v1:' + str));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function avatarColorFor(name) {
      let hash = 0;
      for (let i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) >>> 0;
      return AVATAR_COLORS[hash % AVATAR_COLORS.length];
    }
    function initialsFor(name) {
      const parts = name.trim().split(/\s+/).filter(Boolean);
      if (!parts.length) return '?';
      return (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : '')).toUpperCase();
    }

    function buildMatrix() {
      const { selections } = state;

      const colCount = 1 + totalStudentCols;

      let html = `

        Save selections
      </button>
    </div>` : ''}
  </div>`;
      // Build colgroup html for consistent column widths across all tables
      const PART_W = 150, STU_W = 78;
      function buildColgroup() {

    /* ─── STUDENT ASSESSMENTS ─── */
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1));[a[i], a[j]] = [a[j], a[i]]; }
      return a;
    }

    function getStudentsForPart(partId) {
      // Students signed up for this part, or all students as fallback
      const groups = state.teams.map(t => ({
        teamId: t.id, teamName: t.name,
        students: t.students.filter(s => state.selections[partId + '_' + s.id])
          .map(s => ({ ...s, teamId: t.id, teamName: t.name }))
      })).filter(g => g.students.length > 0);
      const src = groups.length > 0 ? groups :
        state.teams.map(t => ({
          teamId: t.id, teamName: t.name,
          students: t.students.map(s => ({ ...s, teamId: t.id, teamName: t.name }))
        }))
          .filter(g => g.students.length > 0);
      return src.flatMap(g => g.students);
    }

    function generateMutualPairings(partId) {
      const all = getStudentsForPart(partId);
      const teams = [...new Set(all.map(s => s.teamId))];
      if (teams.length < 2 || all.length < 2) return [];

      const shuffled = shuffle(all);
      const pairs = [];
      const used = new Set();

      // Greedy: pair each student with first available from a different team
      for (let i = 0; i < shuffled.length; i++) {
        if (used.has(i)) continue;
        let paired = false;
        for (let j = i + 1; j < shuffled.length; j++) {
          if (!used.has(j) && shuffled[i].teamId !== shuffled[j].teamId) {
            pairs.push({
              aId: shuffled[i].id, aName: shuffled[i].name, aTeam: shuffled[i].teamName,
              bId: shuffled[j].id, bName: shuffled[j].name, bTeam: shuffled[j].teamName,
              crossTeam: true
            });
            used.add(i); used.add(j); paired = true; break;
          }
        }
        // Fallback: pair with any remaining (same-team edge case)
        if (!paired) {
          for (let j = i + 1; j < shuffled.length; j++) {
            if (!used.has(j)) {
              pairs.push({
                aId: shuffled[i].id, aName: shuffled[i].name, aTeam: shuffled[i].teamName,
                bId: shuffled[j].id, bName: shuffled[j].name, bTeam: shuffled[j].teamName,
                crossTeam: shuffled[i].teamId !== shuffled[j].teamId
              });
              used.add(i); used.add(j); paired = true; break;
            }
          }
        }
        // Odd student out — triangulate with an existing pair instead of leaving unpaired
        if (!paired) {
          const odd = shuffled[i];
          // Prefer a pair where odd's team differs from BOTH members (perfect trio)
          let target = pairs.find(p => !p.triangle && p.aTeam !== odd.teamName && p.bTeam !== odd.teamName);
          if (!target) target = pairs.find(p => !p.triangle && (p.aTeam !== odd.teamName || p.bTeam !== odd.teamName));
          if (!target) target = pairs.find(p => !p.triangle);
          if (target) {
            // Try both distinct cycle orderings; pick the one with fewest same-team reviews
            // Cycle A→B→C→A means A reviews B, B reviews C, C reviews A
            const s = [
              { id: target.aId, name: target.aName, team: target.aTeam },
              { id: target.bId, name: target.bName, team: target.bTeam },
              { id: odd.id, name: odd.name, team: odd.teamName }
            ];
            function violations(x, y, z) { return (x.team === y.team ? 1 : 0) + (y.team === z.team ? 1 : 0) + (z.team === x.team ? 1 : 0); }
            // Only two distinct cycles: [0,1,2] vs [0,2,1]
            const [f, g, h] = violations(s[0], s[1], s[2]) <= violations(s[0], s[2], s[1]) ? [s[0], s[1], s[2]] : [s[0], s[2], s[1]];
            target.aId = f.id; target.aName = f.name; target.aTeam = f.team;
            target.bId = g.id; target.bName = g.name; target.bTeam = g.team;
            target.cId = h.id; target.cName = h.name; target.cTeam = h.team;
            target.triangle = true;
          }
          used.add(i);
        }
      }
      return pairs;
    }

    window.generateAllPairings = () => {

    /* ─── SLO COVERAGE ─── */
    function buildCoverage() {
      const { slos, selections, assignments } = state;
      const allStu = allStudents();
      const students = (currentUser?.type === 'team')
        ? allStu.filter(s => s.teamId === currentUser.teamId)
        : allStu;

      // Helper: pts a student contributes to a given SLO
      function studentSloWt(student, si) {
        let w = 0;
        assignments.forEach(a => {
          a.parts.forEach(p => {
            if (!(p.slos || []).includes(si)) return;
            const sel = selections[selKey(p.id, student.id)];
            if (sel) w += sel.weight;
          });
        });
        return w;
      }

      // Helper: total pts claimed by a student
      function studentTotalWt(student) {
        return Object.entries(selections)
          .filter(([k]) => k.endsWith('_' + student.id))
          .reduce((sum, [, v]) => sum + v.weight, 0);
      }

      // Overall SLO totals (across all students)
      const sloTotals = slos.map((_, si) => students.reduce((sum, s) => sum + studentSloWt(s, si), 0));
      const maxSloWt = Math.max(...sloTotals, 1);

      // Max possible pts per SLO (sum of weights of sections mapped to that SLO)
      const sloPossible = slos.map((_, si) =>
        assignments.flatMap(a => a.parts).filter(p => (p.slos || []).includes(si)).reduce((s, p) => s + p.weight, 0));

      const sloHeader = slos.map((s, si) =>
        `<th style="color:${sloColor(si)}">${escapeHtml(s.split(':')[0])}</th>`).join('');
      const mono = `font-family:'DM Mono',monospace`;

      function sloCell(w, si) {
        return w > 0
          ? `<td><span style="font-weight:600;color:${sloColor(si)};${mono}">${w}</span></td>`
          : `<td><span class="tag-none">&mdash;</span></td>`;
      }
      function totalCell(w) {
        return `<td><strong style="${mono}">${w > 0 ? w : '&mdash;'}</strong></td>`;
      }

      let html = `
  <div class="page-header">
    <div class="page-title">SLO Coverage</div>
    <div class="page-sub">Point contributions toward each Student Learning Outcome, broken down by assignment, team, and student.</div>
  </div>`;

      // ── TOTALS ──
      html += `<div class="section-title" style="margin-bottom:12px">Totals</div>
  <div class="coverage-grid" style="margin-bottom:28px">`;
      slos.forEach((slo, si) => {
        const w = sloTotals[si];
        const pct = Math.round((w / maxSloWt) * 100);
        html += `<div class="slo-card">
      <div class="slo-card-name" style="color:${sloColor(si)}">${escapeHtml(slo)}</div>
      <div class="slo-bar-bg"><div class="slo-bar-fill" style="width:${pct}%;background:${sloColor(si)}"></div></div>
      <div class="slo-card-stats"><span>${w} pts</span></div>
    </div>`;
      });
      html += `</div>`;

      // ── BY ASSIGNMENT ──
      html += `<div class="section-title" style="margin-bottom:12px">By assignment</div>

      assignments.forEach(a => {

          const matchingParts = a.parts.filter(p => (p.slos || []).includes(si));

          return students.reduce((sum, s) => {
            return sum + matchingParts.reduce((s2, p) => {
              const sel = selections[selKey(p.id, s.id)];
              return s2 + (sel ? sel.weight : 0);
            }, 0);
          }, 0);
        });
        const assignTotal = students.reduce((sum, s) =>
          sum + a.parts.reduce((s2, p) => {
            const sel = selections[selKey(p.id, s.id)];
            return s2 + (sel ? sel.weight : 0);

        html += `<tr>
      <td><strong>${a.name}</strong></td>

          ? `<td><span class="tag-none">&mdash;</span></td>`

      html += `</tbody></table></div>`;

      // ── BY TEAM ──
      html += `<div class="section-title" style="margin-bottom:12px">By team</div>

    <thead><tr><th>Team</th>${sloHeader}<th>Parts</th><th>Total pts.</th></tr></thead><tbody>`;

      const covTeams = (currentUser?.type === 'team') ? state.teams.filter(t => t.id === currentUser.teamId) : state.teams;
      covTeams.forEach(team => {
        const teamSloWt = slos.map((_, si) =>
          team.students.reduce((sum, s) => sum + studentSloWt(s, si), 0));
        const teamTotal = team.students.reduce((sum, s) => sum + studentTotalWt(s), 0);

        html += `<tr>
      <td><strong>${team.name}</strong></td>
      ${teamSloWt.map((w, si) => sloCell(w, si)).join('')}
      <td>${teamParts > 0 ? teamParts : '<span class="tag-none">&mdash;</span>'}</td>
      ${totalCell(teamTotal)}
    </tr>`;
      });

      // totals row
      const grandTotal = students.reduce((sum, s) => sum + studentTotalWt(s), 0);
      const grandParts = allParts().filter(p => students.some(s => selections[selKey(p.id, s.id)])).length;
      html += `<tr style="border-top:2px solid var(--border)">
    <td style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2)">Total</td>
    ${sloTotals.map((w, si) => sloCell(w, si)).join('')}
    <td><strong style="${mono}">${grandParts > 0 ? grandParts : '&mdash;'}</strong></td>
    ${totalCell(grandTotal)}
  </tr>`;
      html += `</tbody></table></div>`;

      // ── BY STUDENT ──
      const maxPossible = allParts().reduce((s, p) => s + p.weight, 0);
      const stuSloHeader = slos.map((s, si) =>
        `<th style="color:${sloColor(si)}">${escapeHtml(s.split(':')[0])}<br><span style="font-weight:400;font-size:10px;color:var(--text3)">${sloPossible[si]} possible</span></th>`).join('');

      function sloCellWithPossible(w, si) {
        const possible = sloPossible[si];
        if (!w) return `<td><span class="tag-none">&mdash;</span></td>`;
        const pct = possible > 0 ? Math.round(w / possible * 100) : 0;
        return `<td><span style="font-weight:600;color:${sloColor(si)};${mono}">${w}</span><span style="color:var(--text2);font-size:11px;${mono}"> / ${possible} (${pct}%)</span></td>`;
      }

      html += `<div class="section-title" style="margin-bottom:12px">By student</div>
  <div class="coverage-table-wrap"><table>
    <thead><tr><th>Student</th><th>Team</th>${stuSloHeader}<th>Parts</th><th>Total pts.<br><span style="font-weight:400;font-size:10px;color:var(--text3)">${maxPossible} possible</span></th></tr></thead><tbody>`;

      covTeams.forEach(team => {

      </tr>`;
        });
      });

      html += `<tr style="border-top:2px solid var(--border)">
    <td colspan="2" style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--text2)">Total</td>

    <td><strong style="${mono}">${grandParts > 0 ? grandParts : '&mdash;'}</strong></td>
    ${totalCell(grandTotal)}
  </tr>`;
      html += `</tbody></table></div>`;

      return html;
    }

    /* ─── ACTIONS ─── */

    function syncEditingPartFields() {

      for (const a of state.assignments) {

    /* ─── SUMMARY BY STUDENT ─── */
    function buildSummary() {
      const { assignments, selections } = state;
      const mono = `font-family:'DM Mono',monospace`;

      const assignTotals = assignments.map(a => a.parts.reduce((s, p) => s + p.weight, 0));
      const grandPossible = assignTotals.reduce((s, v) => s + v, 0);

      function studentAssignData(student, assign) {
        const claimed = assign.parts.filter(p => selections[selKey(p.id, student.id)]);
        const pts = claimed.reduce((s, p) => s + p.weight, 0);

      let html = `

    <div class="page-title">Individual Contributions</div>

      const visibleTeams = (currentUser?.type === 'team')
        ? state.teams.filter(t => t.id === currentUser.teamId)

      visibleTeams.forEach(team => {
        html += `<div class="section-title" style="margin-bottom:12px">${team.name}</div>
    <div class="coverage-table-wrap" style="margin-bottom:28px"><table style="width:auto">
      <thead><tr>
        <th style="width:130px;min-width:130px;max-width:130px">Student</th>

          const isCol = summaryCollapsedAssignments.has(a.id);

            ${isCol
              ? `<div style="font-size:11px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px">&#9654; ${a.name}</div>`
              : `${a.name} <span style="font-size:9px;opacity:0.4">&#9660;</span><br><span style="font-weight:400;font-size:10px;color:var(--text3)">${assignTotals[ai]} pts available</span>`
            }
          </th>`;
        }).join('')}
        <th style="min-width:110px;border-left:2px solid var(--border)">Grand total<br><span style="font-weight:400;font-size:10px;color:var(--text3)">${grandPossible} pts possible</span></th>
      </tr></thead><tbody>`;

        team.students.forEach(student => {
          const assignData = assignments.map(a => studentAssignData(student, a));
          const grandTotal = assignData.reduce((s, d) => s + d.pts, 0);

          html += `<tr>
        <td style="width:130px;min-width:130px;max-width:130px"><strong>${student.name}</strong></td>
        ${assignData.map((d, ai) => {
            const a = assignments[ai];
            const isCol = summaryCollapsedAssignments.has(a.id);
            const total = assignTotals[ai];
            const pct = total > 0 ? Math.round((d.pts / total) * 100) : 0;
            if (isCol) return `<td style="text-align:center;width:80px;padding:6px 4px"><span style="${mono};font-size:11px;color:${d.pts > 0 ? 'var(--accent)' : 'var(--text3)'}">${d.pts > 0 ? d.pts : '—'}</span></td>`;
            if (d.pts === 0) return `<td><span class="tag-none">&mdash;</span></td>`;
            return `<td>
            <div style="${mono};font-weight:700;font-size:13px;color:var(--accent);margin-bottom:3px">
              ${d.pts} pts

            </div>

    /* ─── DRAG AND DROP ─── */
    function initDragDrop() {
      const container = document.getElementById('assignments-dnd');
      if (!container) return;

      // Rows/blocks only become draggable while the grip handle is held. In dragstart,
      // e.target is the draggable element itself (never the handle), so the handle can't
      // be detected there; and a permanently draggable ancestor would also stop the
      // inputs inside it from being clicked/selected normally.
      container.querySelectorAll('.drag-handle').forEach(handle => {
        handle.addEventListener('mousedown', () => {
          const el = handle.closest('.assign-part-row') || handle.closest('.assign-block');
          if (el) el.setAttribute('draggable', 'true');
        });
      });
      container.addEventListener('mouseup', () => {
        container.querySelectorAll('[draggable]').forEach(el => el.removeAttribute('draggable'));
      });

      // ── Assignment-level drag ──
      let dragAid = null;
      container.querySelectorAll('.assign-block').forEach(block => {
        block.addEventListener('dragstart', e => {
          if (e.target !== block) return; // a section row inside is being dragged
          dragAid = block.dataset.aid;
          setTimeout(() => block.style.opacity = '0.45', 0);
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', '');
        });
        block.addEventListener('dragend', () => {
          block.style.opacity = '';
          block.removeAttribute('draggable');
          dragAid = null;
          container.querySelectorAll('.assign-block').forEach(b => b.classList.remove('drag-over'));
        });
        block.addEventListener('dragover', e => {
          if (!dragAid) return;
          // Ignore if hovering over a part row drag
          if (e.target.closest('.assign-part-row')) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          container.querySelectorAll('.assign-block').forEach(b => b.classList.remove('drag-over'));
          if (block.dataset.aid !== dragAid) block.classList.add('drag-over');
        });
        block.addEventListener('dragleave', e => {
          if (!e.relatedTarget || !block.contains(e.relatedTarget)) block.classList.remove('drag-over');
        });
        block.addEventListener('drop', e => {
          e.preventDefault();
          const targetAid = block.dataset.aid;
          if (dragAid && dragAid !== targetAid) {
            const arr = state.assignments;
            const from = arr.findIndex(a => a.id === dragAid);
            const to = arr.findIndex(a => a.id === targetAid);
            if (from >= 0 && to >= 0) arr.splice(to, 0, arr.splice(from, 1)[0]);
            dragAid = null;
            renderMain();
          }
        });
      });

      // ── Part-level drag within each assignment ──
      container.querySelectorAll('.assign-parts-list').forEach(list => {
        let dragPid = null, dragPAid = null;
        list.querySelectorAll('.assign-part-row[data-pid]').forEach(row => {
          row.addEventListener('dragstart', e => {
            if (e.target !== row) return;
            dragPid = row.dataset.pid;
            dragPAid = row.dataset.aid;
            // stop propagation so assignment drag doesn't fire
            e.stopPropagation();
            setTimeout(() => row.style.opacity = '0.45', 0);
            e.dataTransfer.effectAllowed = 'move';
            e.dataTransfer.setData('text/plain', '');
          });
          row.addEventListener('dragend', () => {
            row.style.opacity = '';
            row.removeAttribute('draggable');
            list.querySelectorAll('.assign-part-row').forEach(r => r.classList.remove('drag-over'));
            dragPid = dragPAid = null;
          });
          row.addEventListener('dragover', e => {
            if (!dragPid) return;
            e.preventDefault(); e.stopPropagation();
            list.querySelectorAll('.assign-part-row').forEach(r => r.classList.remove('drag-over'));
            if (row.dataset.pid !== dragPid) row.classList.add('drag-over');
          });
          row.addEventListener('drop', e => {
            e.preventDefault(); e.stopPropagation();
            const targetPid = row.dataset.pid;
            if (dragPid && dragPAid && dragPid !== targetPid) {
              const a = state.assignments.find(a => a.id === dragPAid);
              if (a) {
                const from = a.parts.findIndex(p => p.id === dragPid);
                const to = a.parts.findIndex(p => p.id === targetPid);
                if (from >= 0 && to >= 0) a.parts.splice(to, 0, a.parts.splice(from, 1)[0]);
              }
              dragPid = dragPAid = null;
              renderMain();
            }
          });
        });
      });
    }

    (async () => {
      await loadState();
      await tryAutoLoadStudentData();
      renderMain();
      startRealtimeSync();
    })();
  </script>


</body>
